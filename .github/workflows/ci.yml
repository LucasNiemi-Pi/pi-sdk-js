name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      # Every leg reports, so a break in one version does not hide the others.
      fail-fast: false
      matrix:
        # `engines` allows Node 18, but the dev toolchain does not: jsdom needs 20.19+.
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Typecheck
        run: yarn typecheck

      - name: Test
        run: yarn test --run

      - name: Build
        run: yarn build
